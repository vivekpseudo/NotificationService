name: NotificationService CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Test signed OKR event intake
        env:
          DEBUG: '0'
          DJANGO_SECRET_KEY: ci-only-random-secret-not-for-deployment-0123456789012345678901234567890123456789
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py test event_intake
